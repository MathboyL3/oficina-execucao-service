apiVersion: v1
kind: Service
metadata:
  name: execucao-postgres
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-postgres
    app.kubernetes.io/part-of: oficina
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: execucao-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: execucao-postgres
  namespace: oficina
  labels:
    app.kubernetes.io/name: execucao-postgres
    app.kubernetes.io/part-of: oficina
spec:
  serviceName: execucao-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: execucao-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execucao-postgres
        app.kubernetes.io/part-of: oficina
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: oficina_execucao
            - name: POSTGRES_USER
              value: oficina
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: execucao-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U oficina -d oficina_execucao"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U oficina -d oficina_execucao"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi