apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-execucao-service-config
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-execucao-service
    app.kubernetes.io/part-of: oficina
data:
  ASPNETCORE_ENVIRONMENT: Production
  Jwt__Issuer: Oficina.Api
  Jwt__Audience: Oficina.Api
  Jwt__ExpirationMinutes: "60"
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  NEW_RELIC_APP_NAME: oficina-execucao-service
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
