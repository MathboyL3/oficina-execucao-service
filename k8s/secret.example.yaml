# ATENCAO: a senha do Postgres aparece em DOIS Secrets (POSTGRES_PASSWORD abaixo e a connection string); a rotacao exige atualizar os dois.
# Copie para k8s/secret.yaml (ignorado no git), preencha e aplique: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: oficina-execucao-service-secrets
  namespace: oficina
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=execucao-postgres;Port=5432;Database=oficina_execucao;Username=oficina;Password=<senha-postgres>"
  Jwt__Secret: "<jwt-secret-min-32-chars>"
  NEW_RELIC_LICENSE_KEY: "<license-key>"
---
apiVersion: v1
kind: Secret
metadata:
  name: execucao-postgres-secret
  namespace: oficina
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<senha-postgres>"
